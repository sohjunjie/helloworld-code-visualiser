<button
  type="button"
  (click)="toggleTheme()"
  [attr.aria-label]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  [title]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
  class="relative p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-900/90 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700/60 transition-all duration-200 cursor-pointer active:scale-95 shadow-2xs hover:shadow-xs focus-visible:ring-2 focus-visible:ring-sky-500 flex items-center justify-center w-9 h-9"
>
  <!-- Sun Icon (Visible in Dark Mode to switch to Light) -->
  <svg
    class="w-4 h-4 text-amber-500 transition-all duration-300 transform"
    [class.rotate-0]="theme.isDarkMode()"
    [class.scale-100]="theme.isDarkMode()"
    [class.opacity-100]="theme.isDarkMode()"
    [class.-rotate-90]="!theme.isDarkMode()"
    [class.scale-0]="!theme.isDarkMode()"
    [class.opacity-0]="!theme.isDarkMode()"
    [class.absolute]="!theme.isDarkMode()"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
    />
  </svg>

  <!-- Moon Icon (Visible in Light Mode to switch to Dark) -->
  <svg
    class="w-4 h-4 text-indigo-600 dark:text-indigo-400 transition-all duration-300 transform"
    [class.rotate-0]="!theme.isDarkMode()"
    [class.scale-100]="!theme.isDarkMode()"
    [class.opacity-100]="!theme.isDarkMode()"
    [class.rotate-90]="theme.isDarkMode()"
    [class.scale-0]="theme.isDarkMode()"
    [class.opacity-0]="theme.isDarkMode()"
    [class.absolute]="theme.isDarkMode()"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
    />
  </svg>
</button>
