<div class="h-full flex flex-col p-4 space-y-4 animate-fade-in min-h-0">
  <!-- Toolbar -->
  <div class="glass-panel p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 border border-slate-200 dark:border-slate-700/60 shadow-xs dark:shadow-xl transition-colors">
    <!-- Search & Filter Controls -->
    <div class="flex items-center space-x-3">
      <div class="relative">
        <input
          type="text"
          placeholder="Search files..."
          aria-label="Filter graph nodes by file name or path"
          [ngModel]="store.searchQuery()"
          (ngModelChange)="onSearchChange($event)"
          class="w-52 px-3 py-1.5 pl-8 text-xs bg-slate-100 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-slate-200 placeholder-slate-500 dark:placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition"
        />
        <svg class="w-4 h-4 text-slate-400 dark:text-slate-400 absolute left-2.5 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <!-- Layout Switcher Buttons -->
      <div role="radiogroup" aria-label="Graph layout algorithm" class="flex items-center space-x-1 bg-slate-200/80 dark:bg-slate-900/90 p-1 rounded-xl border border-slate-300 dark:border-slate-800">
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="store.selectedLayout() === 'dagre'"
          (click)="setLayout('dagre')"
          [class]="store.selectedLayout() === 'dagre' ? 'bg-white dark:bg-sky-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/30 shadow-2xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
          class="px-3 py-1 text-xs rounded-lg transition-all border active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
          aria-label="Hierarchical Dagre layout"
        >
          Hierarchical
        </button>
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="store.selectedLayout() === 'cose'"
          (click)="setLayout('cose')"
          [class]="store.selectedLayout() === 'cose' ? 'bg-white dark:bg-sky-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/30 shadow-2xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
          class="px-3 py-1 text-xs rounded-lg transition-all border active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
          aria-label="Force directed COSE layout"
        >
          Force (COSE)
        </button>
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="store.selectedLayout() === 'concentric'"
          (click)="setLayout('concentric')"
          [class]="store.selectedLayout() === 'concentric' ? 'bg-white dark:bg-sky-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/30 shadow-2xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
          class="px-3 py-1 text-xs rounded-lg transition-all border active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
          aria-label="Concentric layout"
        >
          Concentric
        </button>
      </div>
    </div>

    <!-- Export Diagram Snapshot Button -->
    <button
      type="button"
      (click)="exportDiagram()"
      aria-label="Export dependency graph canvas as PNG image"
      title="Export dependency graph canvas as PNG image"
      class="btn-interactive btn-secondary px-3.5 py-1.5 text-xs font-semibold rounded-xl flex items-center space-x-1.5 focus-visible:ring-2 focus-visible:ring-sky-500"
    >
      <svg class="w-4 h-4 text-sky-600 dark:text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Export Canvas PNG</span>
    </button>
  </div>

  <!-- Graph Canvas Container -->
  <div
    class="flex-1 glass-card rounded-3xl overflow-hidden relative border border-slate-200 dark:border-slate-800 shadow-xs dark:shadow-2xl min-h-0 transition-colors"
    #cyContainer
    role="region"
    aria-label="Interactive dependency graph network canvas"
  >
    <div class="absolute inset-0 w-full h-full" #cyElement></div>

    <!-- Floating Legend Overlay -->
    <div class="absolute bottom-4 left-4 glass-panel p-3 rounded-2xl border border-slate-200 dark:border-slate-700/80 text-xs space-y-1.5 z-20 shadow-lg" role="region" aria-label="Dependency graph legend">
      <div class="font-bold text-slate-800 dark:text-slate-200 flex items-center space-x-1.5">
        <span class="w-2 h-2 rounded-full bg-sky-500 dark:bg-sky-400 animate-pulse"></span>
        <span>Dependency Graph Legend</span>
      </div>
      <div class="flex items-center space-x-3 text-slate-600 dark:text-slate-400 text-[11px]">
        <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-500 dark:bg-sky-400 inline-block"></span><span class="font-medium">File Node</span></span>
        <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-red-500 dark:bg-red-400 inline-block"></span><span class="font-medium">Circular Cycle</span></span>
      </div>
    </div>
  </div>
</div>
