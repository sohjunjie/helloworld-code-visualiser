<header class="header-bar glass-panel shadow-xs dark:shadow-xl">
  <!-- Logo & Title -->
  <button
    type="button"
    class="header-bar__brand group focus-visible:ring-2 focus-visible:ring-sky-500"
    (click)="store.clearResult()"
    aria-label="CodeVisualizer Home - Reset analysis and return to upload"
  >
    <div class="header-bar__brand-icon">
      <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white flex-shrink-0" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
    </div>
    <div class="min-w-0">
      <h1 class="header-bar__brand-title">
        CodeVisualizer
      </h1>
      <p class="header-bar__brand-subtitle hidden xl:block">AST & Dependency Architecture Engine</p>
    </div>
  </button>

  <!-- Navigation Tabs (Only visible when analysis result exists) -->
  @if (store.analysisResult()) {
    <nav
      role="tablist"
      aria-label="Codebase visualizer views"
      (keydown)="onTabKeydown($event)"
      class="header-bar__nav"
    >
      <button
        type="button"
        role="tab"
        id="tab-treemap"
        aria-controls="panel-treemap"
        [attr.aria-selected]="store.activeTab() === 'treemap'"
        (click)="store.setActiveTab('treemap')"
        [class.header-bar__nav-tab--active]="store.activeTab() === 'treemap'"
        class="header-bar__nav-tab btn-tab focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Folder Treemap View"
        title="Folder Treemap"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="hidden lg:inline">
          <span class="hidden xl:inline">Folder </span>Treemap
        </span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-graph"
        aria-controls="panel-graph"
        [attr.aria-selected]="store.activeTab() === 'graph'"
        (click)="store.setActiveTab('graph')"
        [class.header-bar__nav-tab--active]="store.activeTab() === 'graph'"
        class="header-bar__nav-tab btn-tab focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Dependency Graph View"
        title="Dependency Graph"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span class="hidden lg:inline">
          <span class="hidden xl:inline">Dependency </span>Graph
        </span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-architecture"
        aria-controls="panel-architecture"
        [attr.aria-selected]="store.activeTab() === 'architecture'"
        (click)="store.setActiveTab('architecture')"
        [class.header-bar__nav-tab--active]="store.activeTab() === 'architecture'"
        class="header-bar__nav-tab btn-tab focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Architecture Metrics and Patterns View"
        title="Architecture"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <span class="hidden lg:inline">Architecture</span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-inspector"
        aria-controls="panel-inspector"
        [attr.aria-selected]="store.activeTab() === 'inspector'"
        (click)="store.setActiveTab('inspector')"
        [class.header-bar__nav-tab--active]="store.activeTab() === 'inspector'"
        class="header-bar__nav-tab btn-tab focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Code and AST Inspector View"
        title="Code Inspector"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 10-4.243-4.242 3 3 0 004.243 4.242z" />
        </svg>
        <span class="hidden lg:inline">
          <span class="hidden xl:inline">Code </span>Inspector
        </span>
      </button>
    </nav>
  }

  <!-- Controls & Actions -->
  <div class="header-bar__actions">
    <!-- Theme Toggle Utility Component -->
    <app-theme-toggle />

    <!-- Demo Projects Selector -->
    <div class="header-dropdown group">
      <button
        type="button"
        (click)="toggleDemoMenu()"
        [attr.aria-expanded]="isDemoMenuOpen"
        aria-haspopup="menu"
        aria-label="Demo sample codebases menu"
        title="Demo Projects"
        class="btn-interactive btn-secondary px-2.5 sm:px-3.5 py-1.5 text-xs font-semibold rounded-xl flex items-center space-x-1.5 focus-visible:ring-2 focus-visible:ring-sky-500"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <span class="hidden sm:inline">
          <span class="hidden md:inline">Demo </span>Projects
        </span>
        <svg class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400 group-hover:rotate-180 transition-transform duration-300 flex-shrink-0" [class.rotate-180]="isDemoMenuOpen" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown container with seamless top-full positioning and padding buffer -->
      <div
        class="header-dropdown__container"
        [class.header-dropdown__container--open]="isDemoMenuOpen"
      >
        <div
          role="menu"
          aria-label="Sample codebases"
          class="header-dropdown__menu animate-scale-up"
        >
          <p class="header-dropdown__title">Select Sample Codebase</p>
          @for (demo of demoService.getDemoProjects(); track demo.id) {
            <button
              type="button"
              role="menuitem"
              (click)="selectDemo(demo)"
              [attr.aria-label]="'Load sample codebase ' + demo.name"
              class="header-dropdown__item focus-visible:ring-2 focus-visible:ring-sky-500"
            >
              <div class="font-bold flex items-center justify-between">
                <span class="truncate pr-2">{{ demo.name }}</span>
                <span class="header-dropdown__item-badge">{{ demo.fileCount }} files</span>
              </div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate mt-0.5">{{ demo.description }}</div>
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Export JSON Report (When result available) -->
    @if (store.analysisResult()) {
      <button
        type="button"
        (click)="exportReport()"
        aria-label="Export analysis report as JSON"
        title="Export analysis report as JSON"
        class="btn-interactive btn-primary px-2.5 sm:px-3.5 py-1.5 text-xs font-semibold rounded-xl flex items-center space-x-1.5 focus-visible:ring-2 focus-visible:ring-sky-500"
      >
        <svg class="w-4 h-4 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span class="hidden sm:inline">
          <span class="hidden md:inline">Export </span>Report
        </span>
      </button>
    }
  </div>
</header>
