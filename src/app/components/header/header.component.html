<header class="h-16 px-6 glass-panel flex items-center justify-between border-b border-slate-200 dark:border-slate-700/50 sticky top-0 z-40 shadow-xs dark:shadow-xl transition-colors">
  <!-- Logo & Title -->
  <button
    type="button"
    class="flex items-center space-x-3 cursor-pointer group flex-shrink-0 text-left bg-transparent border-0 p-0 focus-visible:ring-2 focus-visible:ring-sky-500 rounded-xl"
    (click)="store.clearResult()"
    aria-label="CodeVisualizer Home - Reset analysis and return to upload"
  >
    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 group-hover:scale-105 group-active:scale-95 transition-transform duration-200 flex-shrink-0">
      <svg class="w-5 h-5 text-white flex-shrink-0" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
    </div>
    <div>
      <h1 class="text-base font-bold bg-gradient-to-r from-sky-600 via-indigo-600 to-sky-800 dark:from-sky-400 dark:via-indigo-300 dark:to-sky-200 bg-clip-text text-transparent group-hover:opacity-85 transition-opacity">
        CodeVisualizer
      </h1>
      <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">AST & Dependency Architecture Engine</p>
    </div>
  </button>

  <!-- Navigation Tabs (Only visible when analysis result exists) -->
  @if (store.analysisResult()) {
    <nav
      role="tablist"
      aria-label="Codebase visualizer views"
      (keydown)="onTabKeydown($event)"
      class="flex items-center space-x-1 bg-slate-200/80 dark:bg-slate-900/80 p-1 rounded-xl border border-slate-300 dark:border-slate-800 shadow-inner"
    >
      <button
        type="button"
        role="tab"
        id="tab-treemap"
        aria-controls="panel-treemap"
        [attr.aria-selected]="store.activeTab() === 'treemap'"
        (click)="store.setActiveTab('treemap')"
        [class]="store.activeTab() === 'treemap' ? 'bg-white dark:bg-gradient-to-r dark:from-sky-500/20 dark:to-indigo-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/40 shadow-xs dark:shadow-sky-500/20' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
        class="btn-tab px-3.5 py-1.5 text-xs rounded-lg transition-all duration-200 border flex items-center space-x-2 active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Folder Treemap View"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span>Folder Treemap</span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-graph"
        aria-controls="panel-graph"
        [attr.aria-selected]="store.activeTab() === 'graph'"
        (click)="store.setActiveTab('graph')"
        [class]="store.activeTab() === 'graph' ? 'bg-white dark:bg-gradient-to-r dark:from-sky-500/20 dark:to-indigo-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/40 shadow-xs dark:shadow-sky-500/20' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
        class="btn-tab px-3.5 py-1.5 text-xs rounded-lg transition-all duration-200 border flex items-center space-x-2 active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Dependency Graph View"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span>Dependency Graph</span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-architecture"
        aria-controls="panel-architecture"
        [attr.aria-selected]="store.activeTab() === 'architecture'"
        (click)="store.setActiveTab('architecture')"
        [class]="store.activeTab() === 'architecture' ? 'bg-white dark:bg-gradient-to-r dark:from-sky-500/20 dark:to-indigo-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/40 shadow-xs dark:shadow-sky-500/20' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
        class="btn-tab px-3.5 py-1.5 text-xs rounded-lg transition-all duration-200 border flex items-center space-x-2 active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Architecture Metrics and Patterns View"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <span>Architecture</span>
      </button>

      <button
        type="button"
        role="tab"
        id="tab-inspector"
        aria-controls="panel-inspector"
        [attr.aria-selected]="store.activeTab() === 'inspector'"
        (click)="store.setActiveTab('inspector')"
        [class]="store.activeTab() === 'inspector' ? 'bg-white dark:bg-gradient-to-r dark:from-sky-500/20 dark:to-indigo-500/20 text-sky-700 dark:text-sky-300 font-semibold border-sky-400/50 dark:border-sky-500/40 shadow-xs dark:shadow-sky-500/20' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 border-transparent hover:bg-slate-300/60 dark:hover:bg-slate-800/60'"
        class="btn-tab px-3.5 py-1.5 text-xs rounded-lg transition-all duration-200 border flex items-center space-x-2 active:scale-95 cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
        aria-label="Code and AST Inspector View"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 21h7a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v11m0 5l4.879-4.879m0 0a3 3 0 10-4.243-4.242 3 3 0 004.243 4.242z" />
        </svg>
        <span>Code Inspector</span>
      </button>
    </nav>
  }

  <!-- Controls & Actions -->
  <div class="flex items-center space-x-3">
    <!-- Theme Toggle Utility Component -->
    <app-theme-toggle />

    <!-- Demo Projects Selector -->
    <div class="relative group">
      <button
        type="button"
        (click)="toggleDemoMenu()"
        [attr.aria-expanded]="isDemoMenuOpen"
        aria-haspopup="menu"
        aria-label="Demo sample codebases menu"
        class="btn-interactive btn-secondary px-3.5 py-1.5 text-xs font-semibold rounded-xl flex items-center space-x-1.5 focus-visible:ring-2 focus-visible:ring-sky-500"
      >
        <svg class="w-4 h-4 text-sky-600 dark:text-sky-400 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
        <span>Demo Projects</span>
        <svg class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400 group-hover:rotate-180 transition-transform duration-300 flex-shrink-0" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div
        role="menu"
        aria-label="Sample codebases"
        [class.block]="isDemoMenuOpen"
        class="absolute right-0 mt-2 w-64 glass-panel rounded-2xl shadow-2xl p-2 border border-slate-200 dark:border-slate-700/80 hidden group-hover:block group-focus-within:block z-50 animate-scale-up"
      >
        <p class="text-[10px] uppercase font-bold text-slate-500 dark:text-slate-400 px-3 py-1.5 tracking-wider">Select Sample Codebase</p>
        @for (demo of demoService.getDemoProjects(); track demo.id) {
          <button
            type="button"
            role="menuitem"
            (click)="selectDemo(demo)"
            [attr.aria-label]="'Load sample codebase ' + demo.name"
            class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-sky-50 dark:hover:bg-sky-500/15 hover:text-sky-700 dark:hover:text-sky-300 text-slate-700 dark:text-slate-300 text-xs transition duration-150 border border-transparent hover:border-sky-300 dark:hover:border-sky-500/30 mb-1 active:scale-[0.98] cursor-pointer focus-visible:ring-2 focus-visible:ring-sky-500"
          >
            <div class="font-bold flex items-center justify-between">
              <span>{{ demo.name }}</span>
              <span class="text-[10px] bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-400 px-1.5 py-0.5 rounded font-mono">{{ demo.fileCount }} files</span>
            </div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate mt-0.5">{{ demo.description }}</div>
          </button>
        }
      </div>
    </div>

    <!-- Export JSON Report (When result available) -->
    @if (store.analysisResult()) {
      <button
        type="button"
        (click)="exportReport()"
        aria-label="Export analysis report as JSON"
        title="Export analysis report as JSON"
        class="btn-interactive btn-primary px-3.5 py-1.5 text-xs font-semibold rounded-xl flex items-center space-x-1.5 focus-visible:ring-2 focus-visible:ring-sky-500"
      >
        <svg class="w-4 h-4 flex-shrink-0" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span>Export Report</span>
      </button>
    }
  </div>
</header>
